<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img"><title>WhoOwnsWhat: shared project costs and account ownership</title><rect width="100%" height="100%" fill="#f6f5f0"/><g transform="translate(60 45)"><rect width="46" height="46" rx="12" fill="#d2f65a" stroke="#151515" stroke-width="2"/><path d="M15 23L31 12M15 23L31 34" stroke="#151515" stroke-width="2.5"/><g fill="#d2f65a" stroke="#151515" stroke-width="2.5"><circle cx="14" cy="23" r="5"/><circle cx="32" cy="11" r="5"/><circle cx="32" cy="35" r="5"/></g></g><text x="122" y="77" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#151515">WhoOwnsWhat.xyz</text><rect x="1110" y="48" width="260" height="44" rx="22" fill="#d2f65a" stroke="#151515" stroke-width="2.5"/><text x="1136" y="77" font-family="monospace" font-size="18" font-weight="700" fill="#151515">THE FOUNDER SKILL</text><text x="60" y="224" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="800" fill="#151515">Who paid what.</text><rect x="53" y="250" width="700" height="94" rx="6" fill="#d2f65a"/><text x="60" y="323" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="800" fill="#151515">Who owns what.</text><text x="64" y="401" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#151515">One skill for the project you started together.</text><text x="64" y="447" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#64645f">Split the costs. Record the owners.</text><text x="64" y="485" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#64645f">Leave the next person a clear next step.</text><rect x="64" y="565" width="665" height="75" rx="14" fill="#151515" stroke="#151515" stroke-width="2.5"/><text x="89" y="612" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="white">“I paid $25 for Supabase. Split it three ways.”</text><text x="64" y="727" font-family="monospace" font-size="18" font-weight="700" fill="#151515">CLAUDE  /  CHATGPT  /  CODEX</text><text x="64" y="763" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#64645f">Use local files. Connect the shared app when you need it.</text><rect x="837" y="178" width="530" height="430" rx="22" fill="#151515"/><rect x="830" y="170" width="530" height="430" rx="22" fill="white" stroke="#151515" stroke-width="2.5"/><text x="864" y="218" font-family="monospace" font-size="19" font-weight="700" fill="#151515">BOTTLE / PROJECT RECORD</text><path d="M832 245H1358" stroke="#151515" stroke-width="2"/><text x="864" y="294" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#151515">Supabase Pro</text><text x="1233" y="294" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#151515">$25.00</text><text x="864" y="328" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#64645f">Paid by Matt · equal expense split</text><rect x="860" y="356" width="470" height="48" rx="9" fill="#d2f65a" stroke="#151515" stroke-width="2.5"/><text x="878" y="388" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#151515">Ana → Matt</text><text x="1235" y="388" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#151515">$8.33</text><rect x="860" y="418" width="470" height="48" rx="9" fill="#d2f65a" stroke="#151515" stroke-width="2.5"/><text x="878" y="450" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#151515">Sam → Matt</text><text x="1235" y="450" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#151515">$8.33</text><text x="864" y="520" font-family="monospace" font-size="16" font-weight="400" fill="#64645f">DOMAIN</text><text x="864" y="555" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#151515">Matt owns it. Who can recover it?</text><rect x="967" y="638" width="375" height="87" rx="12" fill="#151515"/><rect x="960" y="630" width="375" height="87" rx="12" fill="#ffe2d3" stroke="#151515" stroke-width="2.5"/><text x="981" y="665" font-family="monospace" font-size="17" font-weight="700" fill="#151515">NEXT: ADD A BACKUP ADMIN</text><text x="981" y="694" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#151515">Owner: Matt · status: open</text></svg>
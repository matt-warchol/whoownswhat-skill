<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="450" viewBox="0 0 1440 450" role="img"><title>WhoOwnsWhat: shared project costs and account ownership</title><rect width="100%" height="100%" fill="#f6f5f0"/><g transform="translate(44 32)"><rect width="46" height="46" rx="12" fill="#d2f65a" stroke="#151515" stroke-width="2"/><path d="M15 23L31 12M15 23L31 34" stroke="#151515" stroke-width="2.5"/><g fill="#d2f65a" stroke="#151515" stroke-width="2.5"><circle cx="14" cy="23" r="5"/><circle cx="32" cy="11" r="5"/><circle cx="32" cy="35" r="5"/></g></g><text x="106" y="64" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#151515">Start with your files. Share when ready.</text><rect x="51" y="120" width="420" height="230" rx="16" fill="#151515"/><rect x="44" y="112" width="420" height="230" rx="16" fill="white" stroke="#151515" stroke-width="2.5"/><text x="67" y="156" font-family="monospace" font-size="20" font-weight="700" fill="#151515">LOCAL FILES</text><text x="67" y="210" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#151515">Save costs in a JSON ledger.</text><text x="67" y="246" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#151515">Keep owners and tasks in notes.</text><text x="67" y="282" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#151515">No account needed.</text><rect x="507" y="120" width="420" height="230" rx="16" fill="#151515"/><rect x="500" y="112" width="420" height="230" rx="16" fill="#d2f65a" stroke="#151515" stroke-width="2.5"/><text x="523" y="156" font-family="monospace" font-size="20" font-weight="700" fill="#151515">CONNECTED APP</text><text x="523" y="210" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#151515">Use the existing MCP connection.</text><text x="523" y="246" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#151515">Share costs and account records.</text><text x="523" y="282" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#151515">Backlog stays in your notes.</text><rect x="963" y="120" width="420" height="230" rx="16" fill="#151515"/><rect x="956" y="112" width="420" height="230" rx="16" fill="white" stroke="#151515" stroke-width="2.5"/><text x="979" y="156" font-family="monospace" font-size="20" font-weight="700" fill="#151515">CHAT ONLY</text><text x="979" y="210" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#151515">Work through the numbers.</text><text x="979" y="246" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#151515">Copy or download the record.</text><text x="979" y="282" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#151515">Bring it into the next chat.</text><text x="44" y="405" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#64645f">Your assistant keeps the record. Payments and provider access happen outside it.</text></svg>